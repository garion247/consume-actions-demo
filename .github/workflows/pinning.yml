name: Diagnostics

on:
  push:
    branches: [ master ]

jobs:
  good:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Healthy step"

  mixed:
    runs-on: ubuntu-latest
    steps:
      - run: echo "First step works"
      - name: Failing step
        run: |
          echo "About to fail..."
          exit 1
      - run: echo "This step is skipped because of the prior failure"
