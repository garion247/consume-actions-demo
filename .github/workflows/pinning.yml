name: Action Pinning

on:
  push:
    branches: [ master ]

jobs:
  pin-by-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned by floating major tag (@v4)
        uses: actions/checkout@v4

  pin-by-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned by branch (@main) - DO NOT USE IN PRODUCTION
        uses: actions/checkout@main

  pin-by-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned by full SHA (immutable)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
