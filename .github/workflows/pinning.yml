name: Composed Actions

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (provides the source files)
        uses: actions/checkout@v4

      - name: Setup Node (consumes the source, exposes node + npm)
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show outputs from setup-node
        run: |
          echo "node-version: ${{ steps.node.outputs.node-version }}"
          echo "Active node binary: $(which node)"

      - name: Run tests
        run: npm test

      - name: Build artifact
        run: |
          mkdir -p dist
          cp test.js dist/
          echo "Built at $(date -u)" > dist/build.txt

      - name: Upload artifact (consumes dist/, produces a downloadable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1
